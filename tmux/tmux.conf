# Source vim-tmux-navigator tmux integration (handles is_vim detection properly)
run-shell ~/.local/share/nvim/lazy/vim-tmux-navigator/vim-tmux-navigator.tmux

# Remove up/down — keep only left/right
unbind-key -n C-j
unbind-key -n C-k
unbind-key -T copy-mode-vi C-j
unbind-key -T copy-mode-vi C-k

# ── Pane navigation (ctrl+hjkl) ──────────────────────────
# left/right handled by vim-tmux-navigator above
bind -n C-j select-pane -D
bind -n C-k select-pane -U

# ── Copy mode (vi keys) ───────────────────────────────
set-window-option -g mode-keys vi

# ── vim-style copy/paste ─────────────────────────────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# yank to system clipboard via X11 forwarding (requires ssh -X or ssh -Y)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard" \; display-message "copied to clipboard"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard" \; display-message "copied to clipboard"

# ── Escape key fix ──────────────────────────────────────
set -s escape-time 0          # remove escape delay for double-tap
set -g prefix2 None            # ensure secondary prefix isn't escape
set -g extended-keys on

# ── Alt+t / Alt+e scroll (pass through to TUI agents) ───
# When opencode or claude owns the pane, send keys to the TUI's own
# scroll keybinds (they run on the alt-screen, which has no scrollback
# so tmux copy-mode only shows a frozen snapshot).
# Otherwise tmux halfpage scroll (e.g. cursor agent).
bind -n M-t if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE 'opencode|claude'" "send-keys M-t" "copy-mode \; send-keys -X halfpage-up"
bind -n M-e if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE 'opencode|claude'" "send-keys M-e" "copy-mode \; send-keys -X halfpage-down"
bind -T copy-mode-vi M-t send-keys -X halfpage-up
bind -T copy-mode-vi M-e send-keys -X halfpage-down

# ── Auto renumber windows when a window is closed ──
set -g renumber-windows on
